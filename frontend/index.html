<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="NestAI — AI-powered housing discovery built around the way you live. Find a home that fits your life, not just your budget." />
    <title>NestAI — Find a home that fits your life</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <style>
      /* Instant static splash: paints before the JS bundle loads.
         React replaces this markup on mount; visuals mirror Preloader.tsx. */
      #static-splash {
        position: fixed; inset: 0; z-index: 100;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #0b1626; color: #fff;
        font-family: system-ui, -apple-system, sans-serif;
      }
      #static-splash .bar { margin-top: 24px; height: 4px; width: 176px; border-radius: 999px; background: rgba(255,255,255,.15); overflow: hidden; }
      #static-splash .bar > div { height: 100%; width: 0; border-radius: 999px; background: #34d399; animation: splash-fill 3s linear forwards; }
      @keyframes splash-fill { from { width: 0; } to { width: 100%; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="static-splash" role="status" aria-label="Loading NestAI">
        <svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true">
          <rect x="4" y="4" width="56" height="56" rx="16" fill="#ffffff"/>
          <g fill="none" stroke="#0f1e2e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 30 32 19l14 11" />
            <path d="M21 28.5V45h22V28.5" />
          </g>
          <circle cx="50" cy="14" r="9" fill="#10b981"/>
          <path d="M50 9.5l1.3 3.2 3.2 1.3-3.2 1.3-1.3 3.2-1.3-3.2-3.2-1.3 3.2-1.3 1.3-3.2z" fill="#fff"/>
        </svg>
        <p style="margin:20px 0 0;font-size:26px;font-weight:800;letter-spacing:-.02em;">NestAI</p>
        <p style="margin:4px 0 0;font-size:13px;color:#94a3b8;">Finding a home that fits your life…</p>
        <div class="bar" aria-hidden="true"><div></div></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
